<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Secretos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="d-flex flex-row-reverse collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item"><a class="nav-link" href="/inicio">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="/secrets">Secretos</a></li>
                <li class="nav-item"><a class="nav-link" href="/usuario">Usuario</a></li>
                <li class="nav-item"><a class="nav-link" href="/logout">Logout</a></li>
            </ul>
        </div>
    </nav>
    <div class="container mt-5">
        <h1 class="mb-4">Gestión de Secretos</h1>
        <form id="add-secret-form">
            <div class="form-group">
                <label for="name">Nombre del secreto:</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="value">Valor del secreto:</label>
                <input type="text" class="form-control" id="value" name="value" required>
            </div><br><br>
            <button type="submit" class="btn btn-primary">Guardar secreto</button>
        </form>

        <hr>
        <h3 class="mt-5">Secretos guardados:</h3>
        <table class="table table-bordered mt-3">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Valor</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="secret-list">
                {% for secreto in secrets %}
                <tr data-id="{{ secreto.id }}">
                    <td class="nombre">{{ secreto.name }}</td>
                    <td class="valor">
                        <span class="oculto">******</span>
                        <span class="real" style="display:none;">{{ secreto.value }}</span>
                    </td>
                    <td>
                        <button class="btn btn-sm btn-secondary mostrar-btn">Mostrar</button>
                        <button class="btn btn-sm btn-warning editar-btn">Editar</button>
                        <button class="btn btn-sm btn-danger eliminar-btn">Eliminar</button>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="3">No hay secretos aún.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <script>
        document.getElementById("add-secret-form").addEventListener("submit", async function(event) {
            event.preventDefault();
            const name = document.getElementById("name").value;
            const value = document.getElementById("value").value;

            const response = await fetch("/api/secrets", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name, value })
            });

            const data = await response.json();
            if (response.ok) {
                alert(data.message);
                location.reload();
            } else {
                alert("Error: " + (data.error || "No se pudo guardar"));
            }
        });

        document.querySelectorAll(".editar-btn").forEach(btn => {
            btn.addEventListener("click", async function() {
                const row = btn.closest("tr");
                const nombre = row.querySelector(".nombre").textContent;
                const valorActual = row.querySelector(".valor").textContent;
                const nuevoValor = prompt("Nuevo valor para el secreto:", valorActual);

                if (nuevoValor !== null) {
                    const id = row.dataset.id;
                    const response = await fetch(`/api/secrets/${id}`, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ value: nuevoValor })
                    });
                    const data = await response.json();
                    if (response.ok) {
                        alert(data.message);
                        location.reload();
                    } else {
                        alert("Error al editar: " + (data.error || "desconocido"));
                    }
                }
            });
        });

        document.querySelectorAll(".eliminar-btn").forEach(btn => {
            btn.addEventListener("click", async function() {
                const row = btn.closest("tr");
                const nombre = row.querySelector(".nombre").textContent;
                const confirmacion = confirm(`¿Seguro que quieres eliminar el secreto "${nombre}"?`);

                if (confirmacion) {
                    const id = row.dataset.id;
                    const response = await fetch(`/api/secrets/${id}`, {
                        method: "DELETE" });

                    const data = await response.json();
                    if (response.ok) {
                        alert(data.message);
                        location.reload();
                    } else {
                        alert("Error al eliminar: " + (data.error || "desconocido"));
                    }
                }
            });
        });

        document.querySelectorAll('.mostrar-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const row = btn.closest('tr');
                const oculto = row.querySelector('.oculto');
                const real = row.querySelector('.real');
                const visible = real.style.display === 'inline';

                real.style.display = visible ? 'none' : 'inline';
                oculto.style.display = visible ? 'inline' : 'none';
                btn.textContent = visible ? 'Mostrar' : 'Ocultar';
            });
        });
    </script>
</body>
</html>
